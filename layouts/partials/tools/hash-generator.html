<div class="tool-panel">
  <div class="tool-options">
    <div class="tool-field-group">
      <label class="tool-label" for="hash-input">Text</label>
      <textarea id="hash-input" class="tool-textarea" rows="6" placeholder="Type or paste text to hash" autocomplete="off" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="tool-hash-list">
    <div class="tool-hash-row">
      <div class="tool-hash-head">
        <span class="tool-label" id="hash-md5-label">MD5</span>
        <button type="button" id="hash-copy-md5" class="tool-btn" disabled>Copy</button>
      </div>
      <p id="hash-md5" class="tool-output" aria-live="polite" aria-labelledby="hash-md5-label">Hash will appear here</p>
    </div>

    <div class="tool-hash-row">
      <div class="tool-hash-head">
        <span class="tool-label" id="hash-sha1-label">SHA-1</span>
        <button type="button" id="hash-copy-sha1" class="tool-btn" disabled>Copy</button>
      </div>
      <p id="hash-sha1" class="tool-output" aria-live="polite" aria-labelledby="hash-sha1-label">Hash will appear here</p>
    </div>

    <div class="tool-hash-row">
      <div class="tool-hash-head">
        <span class="tool-label" id="hash-sha256-label">SHA-256</span>
        <button type="button" id="hash-copy-sha256" class="tool-btn" disabled>Copy</button>
      </div>
      <p id="hash-sha256" class="tool-output" aria-live="polite" aria-labelledby="hash-sha256-label">Hash will appear here</p>
    </div>
  </div>
</div>
