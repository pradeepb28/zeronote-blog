<div class="tool-panel">
  <p id="password-output" class="tool-output" aria-live="polite">Your password will appear here</p>

  <div class="tool-options">
    <div class="tool-row">
      <label class="tool-label" for="password-length">Length</label>
      <input id="password-length" class="tool-range" type="range" min="8" max="64" value="12" />
      <span id="password-length-value" class="tool-range-value">12</span>
    </div>

    <label class="tool-check">
      <input id="password-capitals" type="checkbox" checked />
      Capital letters
    </label>

    <label class="tool-check">
      <input id="password-numbers" type="checkbox" checked />
      Numbers
    </label>

    <label class="tool-check">
      <input id="password-symbols" type="checkbox" checked />
      Symbols
    </label>
  </div>

  <div class="tool-actions">
    <button type="button" id="password-copy" class="tool-btn">Copy</button>
    <button type="button" id="password-generate" class="tool-btn tool-btn-primary">Generate</button>
  </div>
</div>
