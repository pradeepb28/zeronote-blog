<div class="tool-panel">
  <div class="tool-options">
    <div class="tool-field-group">
      <label class="tool-label" for="link-tracker-remover-input">Link</label>
      <textarea id="link-tracker-remover-input" class="tool-textarea" rows="4" placeholder="Paste a link to remove trackers" autocomplete="off" spellcheck="false"></textarea>
    </div>
  </div>

  <p id="link-tracker-remover-output" class="tool-output" aria-live="polite">Cleaned link will appear here</p>
  <p id="link-tracker-remover-note" class="tool-note" hidden></p>

  <div class="tool-actions">
    <button type="button" id="link-tracker-remover-copy" class="tool-btn tool-btn-primary" disabled>Copy</button>
  </div>
</div>
