{{ define "main" }}

<div class="page-with-cta">
  <div class="page-with-cta__main">
    <article class="post-single">

      <header class="post-header">
        {{ partial "breadcrumbs.html" . }}
        <h1 class="post-title">{{ .Title }}</h1>

        {{ with .Params.description }}
          <p class="post-description">{{ . }}</p>
        {{ end }}

        <div class="post-meta">
          {{ .Date.Format "Jan 2, 2006" }}
        </div>
      </header>

      <div class="post-entry">
        {{ .Content }}
      </div>

    </article>
  </div>

  {{ partial "cta-box.html" . }}
</div>

<div id="mobile-cta">
  <div style="display:flex; justify-content:center; align-items:center;">
    <a href="https://apps.apple.com/us/app/zero-note-self-destruct-notes/id6760115126" target="_blank">
      <img src="/appstore-badge-dark.svg" class="badge-dark" alt="Download Zero Note on the App Store" width="120" height="40" />
      <img src="/appstore-badge-light.svg" class="badge-light" alt="Download Zero Note on the App Store" width="120" height="40" />
    </a>
  </div>
</div>

<script>
  const mobileCTA = document.getElementById("mobile-cta");

  if (mobileCTA) {
    window.addEventListener("scroll", () => {
      const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);

      if (scrollPercent > 0.1) {
        mobileCTA.style.display = "block";
      } else {
        mobileCTA.style.display = "none";
      }
    });
  }
</script>

{{ end }}
